[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetynet-cli"
version = "0.1.0"
description = "SafetyNet CLI - talk to the SafetyNet backend from your terminal."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "rich>=13"]

[project.scripts]
safetynet = "safetynet_cli.cli:main"

[tool.setuptools.packages.find]
include = ["safetynet_cli*"]
